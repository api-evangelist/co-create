name: Co:Create
description: >-
  Co:Create (operated by Gesso Labs, Inc.) was an a16z crypto-backed web3 platform that gave brands and
  developers a REST API to build and run token-driven loyalty, rewards, and community programs on the Polygon
  blockchain. Its API-first toolkit let teams create and manage users and hosted wallets, deploy and manage
  ERC-20, ERC-721, ERC-1155, and Soulbound token contracts, mint and transfer tokens (with synchronous and
  asynchronous variants plus status polling), run reward Campaigns with built-in business logic, issue
  Referrals, and offer Redemptions, Auctions, and Prize Draws. It also provided NFT media/metadata hosting,
  fiat and crypto checkout (via a Crossmint integration), a Co:Create SDK, and Shopify/Salesforce integrations.
  The public developer surface (docs.usecocreate.io, api.cocrt.xyz) is now offline; this profile is
  reconstructed from the provider's own published documentation (archived) and preserved for the network.
