  base_url: https://api.cocrt.xyz
  description: Live environment; on-chain actions run against production contracts on Polygon.
- name: sandbox
  base_url: https://api.testcocrt.xyz
  description: >-
    Free self-service sandbox to try API requests and build an integration before going live. Uses a separate
    sandbox API key.
test_vs_live:
  separation: Separate base URL and separate API key per environment.
  key_model: >-
    Each environment issues its own Secret API Key (generated in Team Settings). Switching environments means
    switching both the base URL and the Bearer key.
